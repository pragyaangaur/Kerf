[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerf"
version = "0.1.0"
description = "Version control that understands geometry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
kerf = "kerf.cli:main"

[tool.setuptools.packages.find]
include = ["kerf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
