name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile every module
        # A syntax error only newer Python accepts will not show up in the
        # tests, because a module nothing imports is never parsed.
        run: python -m compileall -q kerf tests
      - name: Run the test suite
        run: python -m pytest tests -q
      - name: Build the worked example
        run: |
          python -m kerf demo /tmp/demo --quiet
          cd /tmp/demo
          python -m kerf log --stat
          python -m kerf diff HEAD~1 HEAD
